version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    reviewers:
      - Zahidulislam2222
    labels:
      - dependencies
    # Preserve the configuration while automatic version updates are paused.
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - ci
    # Preserve the configuration while automatic version updates are paused.
    open-pull-requests-limit: 0
