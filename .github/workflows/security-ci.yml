name: Native security gates

# No automatic runs or paid AI review. Activation requires an explicit repository
# setting after the owner has reviewed runner availability and billing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-security:
    if: ${{ vars.HEALTHCODE_ACTIONS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build and verification tools
        run: python -m pip install -r requirements.txt ruff mypy bandit semgrep
      - name: Build preserved frontend source
        run: python scripts/build_frontend.py
      - name: Build native editable layouts
        run: python wordpress-native/scripts/build_native.py
      - name: Native behavior and configuration contracts
        run: python -m unittest discover -s tests -p 'test_native_*.py'
      - name: Lint
        run: ruff check wordpress-native/scripts tests/test_native_contracts.py tests/test_native_configuration.py
      - name: Type check
        run: mypy wordpress-native/scripts --ignore-missing-imports
      - name: Python security gate
        run: bandit -q -ll -r wordpress-native/scripts
      - name: Community security rules
        run: semgrep scan --error --config p/security-audit --config p/php --metrics=off wordpress-native/plugin frontend/scripts
      - name: PHP syntax
        run: find wordpress-native/plugin -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Secret scan with redacted output
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
