name: Configure Admin Demo DNS

on:
  # Intentionally manual while GitHub Actions are not in active use.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    name: Configure Cloudflare DNS
    # Legacy / preserved as portfolio proof. This workflow targets the retired
    # custom domain healthcodeanalysis.com (expiring, not renewed). It is muted
    # with `if: false` so it can never run, while the implementation is kept as
    # client-reviewable evidence. Do NOT delete.
    if: false
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE_NAME: healthcodeanalysis.com
      RECORD_NAME: admin-demo.healthcodeanalysis.com
      RECORD_TARGET: fdda85c9-cdc9-4135-a83a-001abcc53c84.cfargotunnel.com
    steps:
      - name: Create or update DNS record
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN secret is not set."
            exit 1
          fi

          api() {
            curl -fsS \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              "$@"
          }

          zone_response="$(api "https://api.cloudflare.com/client/v4/zones?name=${ZONE_NAME}")"
          zone_id="$(jq -r '.result[0].id // empty' <<< "$zone_response")"
          if [ -z "$zone_id" ]; then
            echo "Cloudflare zone was not found for ${ZONE_NAME}."
            exit 1
          fi

          existing_response="$(api "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?type=CNAME&name=${RECORD_NAME}")"
          record_id="$(jq -r '.result[0].id // empty' <<< "$existing_response")"

          payload="$(jq -n \
            --arg name "$RECORD_NAME" \
            --arg content "$RECORD_TARGET" \
            '{type:"CNAME", name:$name, content:$content, ttl:1, proxied:true, comment:"Local WordPress admin demo tunnel"}')"

          if [ -n "$record_id" ]; then
            api -X PUT --data "$payload" "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records/${record_id}" >/dev/null
            echo "Updated ${RECORD_NAME}"
          else
            api -X POST --data "$payload" "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records" >/dev/null
            echo "Created ${RECORD_NAME}"
          fi

      - name: Show DNS result
        shell: bash
        run: |
          dig +short CNAME "${RECORD_NAME}" @1.1.1.1 || true
