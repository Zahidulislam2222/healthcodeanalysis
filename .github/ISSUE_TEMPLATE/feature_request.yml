name: Feature request
description: Propose an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: checkboxes
    id: impact
    attributes:
      label: Does this add any of the following?
      description: These need a legal and security review before they can be enabled (see docs/legal/COMPLIANCE-REGISTER.md).
      options:
        - label: Collection of personal or health data
        - label: Analytics, advertising or affiliate tracking
        - label: Public accounts, forms or uploads
        - label: AI / model integration
        - label: Paid infrastructure or services
