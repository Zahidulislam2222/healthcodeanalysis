worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        absolute_redirect off;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
        add_header Cache-Control "public, no-cache, no-transform" always;
        location = /healthz { access_log off; return 200 "healthcode-ok\n"; }
        location = /build-manifest.json { return 404; }
        location ~ /\. { deny all; }
        location ~ \.mjs$ {
            types { application/javascript mjs; }
            try_files $uri =404;
        }
        location / { try_files $uri $uri/ =404; }
        error_page 404 /404.html;
    }
}
